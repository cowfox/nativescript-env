# =============================================================================
# Release — @wuneo/nativescript-env → npmjs.org (public)
# =============================================================================
# Synchronized with neo-shared-tooling (templates/ts-lib/.github/workflows/release.yml)
#
# neo publish model — publishing is triggered by a git TAG, never by a branch
# push. Pushing commits to release/** or develop starts NO workflow run;
# only `make tag push` (or pushing git tag v*) triggers CI publishing.
#
#   dev preview   develop    → v<ver>-dev.N   → dist-tag: dev
#   pre-release   release/*   → v<ver>-alpha.N → dist-tag: alpha | beta | rc
#   final         release/*   → v<ver>         → dist-tag: latest
#
# The tag is created ONLY on the `make release` version-bump commit (via `make tag push`),
# so a tag always points at a real release. dist-tag is auto-selected by
# `changeset publish` from .changeset/pre.json at the tagged commit.
#
# Required repo secret:
#   NPM_TOKEN — an npm automation token with publish rights on the @wuneo scope.
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  release:
    name: '🚀 Release'
    runs-on: ubuntu-latest
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4

      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v4

      - name: '🟢 Setup Node.js + npm registry'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@wuneo'

      - name: '🔑 Authenticate npm'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: '📥 Install'
        run: pnpm install --frozen-lockfile

      - name: '🔍 Resolve version'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Publishing $VERSION (tag: ${GITHUB_REF_NAME})"

      - name: '🚀 Publish (build + changeset publish)'
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
