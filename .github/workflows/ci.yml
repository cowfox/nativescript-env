# =============================================================================
# CI — @wuneo/nativescript-env
# =============================================================================
# Adapted from neo-shared-tooling (templates/ts-lib). Self-contained: no remote
# reusable-workflow reference (public repo, tooling is vendored by copy).
#
# PR quality gate: typecheck → build + export check.
# (No lint job: this project has no linter configured yet.)
# =============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: '🏷️ Typecheck'
    runs-on: ubuntu-latest
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4
      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v4
      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: '📥 Install'
        run: pnpm install --frozen-lockfile
      - name: '🏷️ tsc --noEmit'
        run: pnpm check:types

  build:
    name: '🏗️ Build'
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4
      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v4
      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: '📥 Install'
        run: pnpm install --frozen-lockfile
      - name: '🏗️ Build library'
        run: pnpm build
      - name: '🔗 Validate exports'
        run: pnpm check:exports
